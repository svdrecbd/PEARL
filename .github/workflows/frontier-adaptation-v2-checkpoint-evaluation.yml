name: Frontier adaptation v2 — one immutable checkpoint evaluation
run-name: Frontier eval ${{ inputs.campaign }} ${{ inputs.run_key }} supervisor-${{ inputs.supervisor_run_id }}

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Frozen cohort
        required: true
        type: choice
        options:
          - original
          - replication
      stage:
        description: Frozen launch-plan stage
        required: true
        type: choice
        options:
          - core
      run_key:
        description: Exact immutable run key
        required: true
        type: string
      launch_plan_sha:
        description: Exact launch-plan contract SHA
        required: true
        type: string
      source_run_id:
        description: Actions run containing the terminal training checkpoint record
        required: true
        type: string
      source_artifact_name:
        description: Exact terminal training artifact name
        required: true
        type: string
      supervisor_run_id:
        description: One-time campaign-supervisor Actions run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: frontier-adaptation-v2-evaluation-${{ inputs.run_key }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_CAMPAIGN: ${{ inputs.campaign }}
      INPUT_STAGE: ${{ inputs.stage }}
      INPUT_RUN_KEY: ${{ inputs.run_key }}
      INPUT_PLAN_SHA: ${{ inputs.launch_plan_sha }}
      INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      INPUT_SOURCE_ARTIFACT_NAME: ${{ inputs.source_artifact_name }}
      INPUT_SUPERVISOR_RUN_ID: ${{ inputs.supervisor_run_id }}
      DATA_RELEASE_TAG: scaling-paradox-v1-data-v2
      DATA_ARCHIVE: pearl-scaling-paradox-v1-data-v2.tar.gz
      DATA_ARCHIVE_SHA256: ffad79ec8e104bf06979882e186290ea4d94b87531e48b111e954b6c09e8e962
    steps:
      - name: Check out the exact supervisor commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the pinned PEARL runtime
        run: python -m pip install --requirement requirements.txt

      - name: Restore and verify the frozen dataset
        run: |
          gh release download "$DATA_RELEASE_TAG" --pattern "$DATA_ARCHIVE"
          printf '%s  %s\n' "$DATA_ARCHIVE_SHA256" "$DATA_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$DATA_ARCHIVE"

      - name: Download source checkpoint record and supervisor authorization
        run: |
          [[ "$INPUT_RUN_KEY" =~ ^[a-z0-9][a-z0-9._-]{0,199}$ ]] || { echo "invalid run key"; exit 1; }
          [[ "$INPUT_PLAN_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid plan SHA"; exit 1; }
          [[ "$INPUT_SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid source run ID"; exit 1; }
          [[ "$INPUT_SUPERVISOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid supervisor run ID"; exit 1; }
          [[ "$INPUT_SOURCE_ARTIFACT_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,199}$ ]] || { echo "invalid artifact name"; exit 1; }
          printf 'SAFE_RUN_KEY=%s\n' "$INPUT_RUN_KEY" >> "$GITHUB_ENV"
          mkdir -p source supervisor
          gh run download "$INPUT_SOURCE_RUN_ID" \
            --name "$INPUT_SOURCE_ARTIFACT_NAME" --dir source
          auth_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$INPUT_SUPERVISOR_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("frontier-adaptation-v2-authorization-")) | .name] | if length == 1 then .[0] else error("authorization artifact absent or non-unique") end')
          gh run download "$INPUT_SUPERVISOR_RUN_ID" \
            --name "$auth_name" --dir supervisor

      - name: Verify source plan and one-time authorization
        run: |
          if [ "$INPUT_CAMPAIGN" = original ]; then
            config="configs/experiments/frontier_adaptation_v2_original.json"
            plan_dir="reports/frontier_adaptation_v2_original"
          else
            config="configs/experiments/frontier_adaptation_v2_replication.json"
            plan_dir="reports/frontier_adaptation_v2_replication"
          fi
          export SAFE_PLAN_DIR="$plan_dir"
          python scripts/launch_scaling_paradox_v1.py \
            --config "$config" --stage "$INPUT_STAGE" --plan-dir "$plan_dir" > launch-plan.json
          python scripts/verify_scaling_paradox_authorization.py \
            --authorization supervisor/authorization.json \
            --supervisor-run-id "$INPUT_SUPERVISOR_RUN_ID" \
            --action dispatch_evaluation_wave \
            --campaign "$INPUT_CAMPAIGN" \
            --stage "$INPUT_STAGE" \
            --run-key "$INPUT_RUN_KEY" \
            --plan-sha "$INPUT_PLAN_SHA" \
            --source-run-id "$INPUT_SOURCE_RUN_ID" \
            --supervisor-workflow-name "Frontier adaptation v2 — validate and dispatch one exact wave" \
            --receipt-output evaluation/worker_authorization_receipt.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plans = [Path(os.environ["SAFE_PLAN_DIR"]) / f"{os.environ['INPUT_STAGE']}_launch_plan.json"]
          matches = []
          for path in plans:
              plan = json.loads(path.read_text())
              if plan["launch_plan_contract_sha"] != os.environ["INPUT_PLAN_SHA"]:
                  continue
              matches.extend(row for row in plan["runs"] if row["run_key"] == os.environ["INPUT_RUN_KEY"])
          contracts = list(Path("source").rglob("run_contract.json"))
          reports = list(Path("source").rglob("report.json"))
          lineages = list(Path("source").rglob("checkpoint_lineage.json"))
          if len(matches) != 1 or len(contracts) != 1 or len(reports) != 1 or len(lineages) != 1:
              raise SystemExit("source artifact or frozen plan is absent/non-unique")
          if json.loads(contracts[0].read_text()) != matches[0]:
              raise SystemExit("source run contract differs from frozen plan")
          Path("source_paths.json").write_text(json.dumps({
              "contract": str(contracts[0]), "report": str(reports[0]),
              "lineage": str(lineages[0])
          }))
          PY

      - name: Evaluate both exact endpoint partitions from the terminal checkpoint
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          contract=$(python -c 'import json; print(json.load(open("source_paths.json"))["contract"])')
          report=$(python -c 'import json; print(json.load(open("source_paths.json"))["report"])')
          lineage=$(python -c 'import json; print(json.load(open("source_paths.json"))["lineage"])')
          python scripts/audit_scaling_paradox_provider.py \
            --run-contract "$contract" --checkpoint-lineage "$lineage" \
            --output evaluation/provider_identity_receipt.json
          python scripts/evaluate_scaling_paradox_checkpoint.py \
            --run-contract "$contract" --training-report "$report" --output-dir evaluation

      - name: Preserve immutable checkpoint evaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontier-adaptation-v2-evaluation-${{ env.SAFE_RUN_KEY }}
          path: evaluation/
          if-no-files-found: error
          retention-days: 90
