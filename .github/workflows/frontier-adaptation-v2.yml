name: Frontier adaptation v2 — one immutable run
run-name: Frontier train ${{ inputs.campaign }} ${{ inputs.run_key }} supervisor-${{ inputs.supervisor_run_id || 'validate' }}

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Frozen cohort
        required: true
        type: choice
        options:
          - original
          - replication
      mode:
        description: Validate the remote contract without spending, or execute one paid cell
        required: true
        default: validate
        type: choice
        options:
          - validate
          - execute
      stage:
        description: Frozen launch-plan stage
        required: true
        type: choice
        options:
          - smoke
          - core
      run_key:
        description: Exact immutable run key from the dry launch plan
        required: true
        type: string
      launch_plan_sha:
        description: Exact launch-plan contract SHA
        required: true
        type: string
      supervisor_run_id:
        description: Required one-time campaign-supervisor Actions run ID for paid execution
        required: false
        type: string
      resume_run_id:
        description: Prior Actions run ID whose checkpoint artifact should be resumed
        required: false
        type: string
      authorization_action:
        description: Exact supervisor action
        required: true
        default: dispatch_training_wave
        type: choice
        options:
          - dispatch_training_wave
          - dispatch_training_resume
      segment_end_step:
        description: Supervisor-authorized absolute operational checkpoint boundary
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: frontier-adaptation-v2-${{ inputs.run_key }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      WANDB_MODE: disabled
      PYTHONUNBUFFERED: "1"
      INPUT_CAMPAIGN: ${{ inputs.campaign }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_STAGE: ${{ inputs.stage }}
      INPUT_RUN_KEY: ${{ inputs.run_key }}
      INPUT_PLAN_SHA: ${{ inputs.launch_plan_sha }}
      INPUT_SUPERVISOR_RUN_ID: ${{ inputs.supervisor_run_id }}
      INPUT_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      INPUT_AUTHORIZATION_ACTION: ${{ inputs.authorization_action }}
      INPUT_SEGMENT_END_STEP: ${{ inputs.segment_end_step }}
      DATA_RELEASE_TAG: scaling-paradox-v1-data-v2
      DATA_ARCHIVE: pearl-scaling-paradox-v1-data-v2.tar.gz
      DATA_ARCHIVE_SHA256: ffad79ec8e104bf06979882e186290ea4d94b87531e48b111e954b6c09e8e962
    steps:
      - name: Check out the exact submitted branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the pinned PEARL runtime
        run: python -m pip install --requirement requirements.txt

      - name: Restore the frozen PEARL dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DATA_RELEASE_TAG" --pattern "$DATA_ARCHIVE"
          printf '%s  %s\n' "$DATA_ARCHIVE_SHA256" "$DATA_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$DATA_ARCHIVE"
          python - <<'PY'
          import json
          manifest = json.load(open("data/phase8_dpo/scaling_paradox_v1/dataset_manifest.json"))
          expected = "1f410d4346b354b789408729c2c7cfc1f0bdef3b9580716171d86593bd9e9a22"
          if manifest.get("manifest_sha256") != expected:
              raise SystemExit("dataset manifest contract SHA mismatch")
          PY

      - name: Restore a previous checkpoint artifact
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$INPUT_CAMPAIGN" = original ]; then
            prefix=frontier-adaptation-v2-original-
            restore_dir="reports/frontier_adaptation_v2_original/runs/$INPUT_RUN_KEY"
          else
            prefix=frontier-adaptation-v2-replication-
            restore_dir="reports/frontier_adaptation_v2_replication/runs/$INPUT_RUN_KEY"
          fi
          mkdir -p "$restore_dir"
          gh run download "$INPUT_RESUME_RUN_ID" \
            --name "${prefix}${INPUT_RUN_KEY}" \
            --dir "$restore_dir"

      - name: Verify immutable plan identity
        run: |
          [[ "$INPUT_RUN_KEY" =~ ^[a-z0-9][a-z0-9._-]{0,199}$ ]] || { echo "invalid run key"; exit 1; }
          [[ "$INPUT_PLAN_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid plan SHA"; exit 1; }
          [[ -z "$INPUT_SUPERVISOR_RUN_ID" || "$INPUT_SUPERVISOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid supervisor ID"; exit 1; }
          [[ -z "$INPUT_RESUME_RUN_ID" || "$INPUT_RESUME_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid resume ID"; exit 1; }
          [[ -z "$INPUT_SEGMENT_END_STEP" || "$INPUT_SEGMENT_END_STEP" =~ ^[1-9][0-9]*$ ]] || { echo "invalid segment end"; exit 1; }
          if [ "$INPUT_CAMPAIGN" = original ]; then
            config="configs/experiments/frontier_adaptation_v2_original.json"
            plan_dir="reports/frontier_adaptation_v2_original"
            artifact_prefix="frontier-adaptation-v2-original-"
          else
            test "$INPUT_STAGE" = core || { echo "replication permits core only"; exit 1; }
            config="configs/experiments/frontier_adaptation_v2_replication.json"
            plan_dir="reports/frontier_adaptation_v2_replication"
            artifact_prefix="frontier-adaptation-v2-replication-"
          fi
          export SAFE_CONFIG="$config" SAFE_PLAN_DIR="$plan_dir" SAFE_ARTIFACT_PREFIX="$artifact_prefix"
          printf 'SAFE_CONFIG=%s\nSAFE_PLAN_DIR=%s\nSAFE_ARTIFACT_PREFIX=%s\n' "$config" "$plan_dir" "$artifact_prefix" >> "$GITHUB_ENV"
          printf 'SAFE_RUN_KEY=%s\n' "$INPUT_RUN_KEY" >> "$GITHUB_ENV"
          python scripts/launch_scaling_paradox_v1.py --config "$config" --stage "$INPUT_STAGE" --plan-dir "$plan_dir" > launch-plan.json
          python - <<'PY'
          import json
          import os
          plan = json.load(open(f"{os.environ['SAFE_PLAN_DIR']}/{os.environ['INPUT_STAGE']}_launch_plan.json"))
          if plan["launch_plan_contract_sha"] != os.environ["INPUT_PLAN_SHA"]:
              raise SystemExit("launch-plan SHA mismatch")
          matches = [row for row in plan["runs"] if row["run_key"] == os.environ["INPUT_RUN_KEY"]]
          if len(matches) != 1:
              raise SystemExit("run key is absent or non-unique")
          if os.environ.get("INPUT_MODE", "execute") == "execute":
              segment = int(os.environ.get("INPUT_SEGMENT_END_STEP") or 0)
              if not (0 < segment <= int(matches[0]["max_steps"])):
                  raise SystemExit("segment end is outside the frozen optimizer trajectory")
          PY

      - name: Verify one-time supervisor authorization
        if: inputs.mode == 'execute'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$INPUT_SUPERVISOR_RUN_ID" || { echo "paid execution requires supervisor_run_id"; exit 1; }
          if [ "$INPUT_AUTHORIZATION_ACTION" = dispatch_training_resume ]; then
            test -n "$INPUT_RESUME_RUN_ID" || { echo "resume authorization requires a source run ID"; exit 1; }
          else
            test -z "$INPUT_RESUME_RUN_ID" || { echo "initial authorization cannot restore a prior run"; exit 1; }
          fi
          mkdir -p supervisor
          auth_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$INPUT_SUPERVISOR_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("frontier-adaptation-v2-authorization-")) | .name] | if length == 1 then .[0] else error("authorization artifact absent or non-unique") end')
          gh run download "$INPUT_SUPERVISOR_RUN_ID" \
            --name "$auth_name" \
            --dir supervisor
          source_args=()
          if [ -n "$INPUT_RESUME_RUN_ID" ]; then source_args=(--source-run-id "$INPUT_RESUME_RUN_ID"); fi
          python scripts/verify_scaling_paradox_authorization.py \
            --authorization supervisor/authorization.json \
            --supervisor-run-id "$INPUT_SUPERVISOR_RUN_ID" \
            --action "$INPUT_AUTHORIZATION_ACTION" \
            --campaign "$INPUT_CAMPAIGN" \
            --stage "$INPUT_STAGE" \
            --run-key "$INPUT_RUN_KEY" \
            --plan-sha "$INPUT_PLAN_SHA" \
            --segment-end-step "$INPUT_SEGMENT_END_STEP" \
            "${source_args[@]}" \
            --supervisor-workflow-name "Frontier adaptation v2 — validate and dispatch one exact wave" \
            --receipt-output "$SAFE_PLAN_DIR/runs/$INPUT_RUN_KEY/worker_authorization_receipt.json"

      - name: Write a no-spend remote validation receipt
        if: inputs.mode == 'validate'
        run: |
          mkdir -p "$SAFE_PLAN_DIR/runs/$INPUT_RUN_KEY"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = {
              "mode": "validate",
              "stage": os.environ["INPUT_STAGE"],
              "run_key": os.environ["INPUT_RUN_KEY"],
              "launch_plan_sha": os.environ["INPUT_PLAN_SHA"],
              "dataset_archive_sha256": "ffad79ec8e104bf06979882e186290ea4d94b87531e48b111e954b6c09e8e962",
              "dataset_manifest_sha256": "1f410d4346b354b789408729c2c7cfc1f0bdef3b9580716171d86593bd9e9a22",
              "paid_execution": False,
          }
          path = Path(os.environ["SAFE_PLAN_DIR"]) / "runs" / os.environ["INPUT_RUN_KEY"] / "remote_validation_receipt.json"
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Verify Tinker provider access without spending
        if: inputs.mode == 'validate'
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          run_dir = Path(os.environ["SAFE_PLAN_DIR"]) / "runs" / os.environ["INPUT_RUN_KEY"]
          path = run_dir / "provider_preflight.json"
          receipt = {
              "contract": "pearl.frontier-adaptation-v2-provider-preflight/1",
              "run_key": os.environ["INPUT_RUN_KEY"],
              "status": "checking_provider",
              "paid_execution": False,
          }
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          try:
              script = Path("scripts/launch_scaling_paradox_v1.py")
              spec = importlib.util.spec_from_file_location("scaling_paradox_launcher", script)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              contract_shas, run_keys = module.provider_contracts()
              receipt.update({
                  "status": "provider_access_verified",
                  "provider_contract_sha_count": len(contract_shas),
                  "provider_run_key_count": len(run_keys),
                  "tinker_cli": module.resolve_tinker_cli(),
              })
          except Exception as error:
              receipt.update({
                  "status": "provider_access_failed",
                  "failure": f"{type(error).__name__}: {error}",
              })
              path.write_text(json.dumps(receipt, indent=2) + "\n")
              raise
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Run one supervised Tinker cell
        if: inputs.mode == 'execute'
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          resume=()
          if [ -n "$INPUT_RESUME_RUN_ID" ]; then
            resume=(--resume)
          fi
          timeout --signal=TERM --kill-after=60s 330m \
            python scripts/launch_scaling_paradox_v1.py \
              --config "$SAFE_CONFIG" \
              --stage "$INPUT_STAGE" \
              --plan-dir "$SAFE_PLAN_DIR" \
              --execute \
              --wait \
              --run-key "$INPUT_RUN_KEY" \
              --confirm-contract-sha "$INPUT_PLAN_SHA" \
              --segment-end-step "$INPUT_SEGMENT_END_STEP" \
              "${resume[@]}"

      - name: Validate terminal or resumable segment report
        if: success() && inputs.mode == 'execute'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          run_dir = Path(os.environ["SAFE_PLAN_DIR"]) / "runs" / os.environ["INPUT_RUN_KEY"]
          contract = json.load(open(run_dir / "run_contract.json"))
          segment_end = int(os.environ["INPUT_SEGMENT_END_STEP"])
          report_path = run_dir / "report.json"
          if report_path.is_file():
              report = json.load(open(report_path))
              if report.get("contract_sha") != contract.get("run_contract_sha"):
                  raise SystemExit("terminal report/contract mismatch")
              if len(report.get("batches", [])) != int(contract["max_steps"]):
                  raise SystemExit("terminal report has an incomplete optimizer trajectory")
              if not report.get("checkpoint_path") or segment_end != int(contract["max_steps"]):
                  raise SystemExit("terminal report is missing its authorized final checkpoint")
          else:
              continuation = json.load(open(run_dir / "continuation_report.json"))
              metadata = json.load(open(run_dir / "checkpoint_meta.json"))
              batches = json.load(open(run_dir / "batch_reports_checkpoint.json"))
              if (
                  continuation.get("run_contract_sha") != contract.get("run_contract_sha")
                  or int(continuation.get("completed_steps", -1)) != segment_end
                  or int(metadata.get("completed_steps", -1)) != segment_end
                  or len(batches) != segment_end
                  or continuation.get("terminal") is not False
              ):
                  raise SystemExit("resumable segment evidence is incomplete or mismatched")
          PY

      - name: Preserve reports and resumable checkpoint lineage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.SAFE_ARTIFACT_PREFIX }}${{ env.SAFE_RUN_KEY }}
          path: ${{ env.SAFE_PLAN_DIR }}/runs/${{ env.SAFE_RUN_KEY }}/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
