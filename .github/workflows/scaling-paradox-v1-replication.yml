name: Scaling paradox v1 replication — one immutable run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the replication contract without spending, or execute one paid cell
        required: true
        default: validate
        type: choice
        options:
          - validate
          - execute
      run_key:
        description: Exact immutable replication run key from the frozen dry launch plan
        required: true
        type: string
      launch_plan_sha:
        description: Exact replication launch-plan contract SHA
        required: true
        type: string
      resume_run_id:
        description: Prior replication Actions run ID whose checkpoint artifact should be resumed
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: scaling-paradox-v1-replication-${{ inputs.run_key }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
      WANDB_MODE: disabled
      PYTHONUNBUFFERED: "1"
      DATA_RELEASE_TAG: scaling-paradox-v1-data-v2
      DATA_ARCHIVE: pearl-scaling-paradox-v1-data-v2.tar.gz
      DATA_ARCHIVE_SHA256: ffad79ec8e104bf06979882e186290ea4d94b87531e48b111e954b6c09e8e962
      REPLICATION_CONFIG: configs/experiments/scaling_paradox_v1_replication.json
      REPLICATION_PLAN_DIR: reports/scaling_paradox_v1_replication
    steps:
      - name: Check out the exact submitted branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the pinned PEARL runtime
        run: python -m pip install --requirement requirements.txt

      - name: Restore the frozen PEARL dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DATA_RELEASE_TAG" --pattern "$DATA_ARCHIVE"
          printf '%s  %s\n' "$DATA_ARCHIVE_SHA256" "$DATA_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$DATA_ARCHIVE"
          python - <<'PY'
          import json
          manifest = json.load(open("data/phase8_dpo/scaling_paradox_v1/dataset_manifest.json"))
          expected = "1f410d4346b354b789408729c2c7cfc1f0bdef3b9580716171d86593bd9e9a22"
          if manifest.get("manifest_sha256") != expected:
              raise SystemExit("dataset manifest contract SHA mismatch")
          PY

      - name: Restore a previous replication checkpoint artifact
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "${{ inputs.resume_run_id }}"
          --name "scaling-paradox-v1-replication-${{ inputs.run_key }}" --dir .

      - name: Verify immutable replication plan identity
        env:
          EXPECTED_PLAN_SHA: ${{ inputs.launch_plan_sha }}
          EXPECTED_RUN_KEY: ${{ inputs.run_key }}
        run: |
          python scripts/launch_scaling_paradox_v1.py \
            --config "$REPLICATION_CONFIG" \
            --stage core \
            --plan-dir "$REPLICATION_PLAN_DIR" > launch-plan.json
          python - <<'PY'
          import json
          import os
          plan = json.load(open("reports/scaling_paradox_v1_replication/core_launch_plan.json"))
          if plan["launch_plan_contract_sha"] != os.environ["EXPECTED_PLAN_SHA"]:
              raise SystemExit("replication launch-plan SHA mismatch")
          matches = [row for row in plan["runs"] if row["run_key"] == os.environ["EXPECTED_RUN_KEY"]]
          if len(matches) != 1:
              raise SystemExit("replication run key is absent or non-unique")
          PY

      - name: Write a no-spend replication validation receipt
        if: inputs.mode == 'validate'
        env:
          EXPECTED_PLAN_SHA: ${{ inputs.launch_plan_sha }}
          EXPECTED_RUN_KEY: ${{ inputs.run_key }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          receipt = {
              "mode": "validate",
              "stage": "core",
              "campaign_id": "pearl-scaling-paradox-v1-replication",
              "run_key": os.environ["EXPECTED_RUN_KEY"],
              "launch_plan_sha": os.environ["EXPECTED_PLAN_SHA"],
              "dataset_archive_sha256": "ffad79ec8e104bf06979882e186290ea4d94b87531e48b111e954b6c09e8e962",
              "dataset_manifest_sha256": "1f410d4346b354b789408729c2c7cfc1f0bdef3b9580716171d86593bd9e9a22",
              "paid_execution": False,
          }
          path = Path("reports/scaling_paradox_v1_replication/runs") / os.environ["EXPECTED_RUN_KEY"]
          path.mkdir(parents=True, exist_ok=True)
          (path / "remote_validation_receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Verify Tinker provider access without spending
        if: inputs.mode == 'validate'
        env:
          EXPECTED_RUN_KEY: ${{ inputs.run_key }}
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          run_dir = Path("reports/scaling_paradox_v1_replication/runs") / os.environ["EXPECTED_RUN_KEY"]
          path = run_dir / "provider_preflight.json"
          receipt = {
              "contract": "pearl.scaling-paradox-provider-preflight/1",
              "campaign_id": "pearl-scaling-paradox-v1-replication",
              "run_key": os.environ["EXPECTED_RUN_KEY"],
              "status": "checking_provider",
              "paid_execution": False,
          }
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          try:
              script = Path("scripts/launch_scaling_paradox_v1.py")
              spec = importlib.util.spec_from_file_location("scaling_paradox_launcher", script)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              contract_shas, run_keys = module.provider_contracts()
              receipt.update({
                  "status": "provider_access_verified",
                  "provider_contract_sha_count": len(contract_shas),
                  "provider_run_key_count": len(run_keys),
                  "tinker_cli": module.resolve_tinker_cli(),
              })
          except Exception as error:
              receipt.update({
                  "status": "provider_access_failed",
                  "failure": f"{type(error).__name__}: {error}",
              })
              path.write_text(json.dumps(receipt, indent=2) + "\n")
              raise
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Verify original v1 core gate receipt
        if: inputs.mode == 'execute'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("configs/experiments/scaling_paradox_v1_replication_gate.json")
          if not path.is_file():
              raise SystemExit("replication is blocked: reviewed v1 core gate receipt is absent")
          gate = json.loads(path.read_text())
          expected = {
              "contract": "pearl.scaling-paradox-v1-replication-gate/1",
              "original_launch_plan_sha": "f63f3bd2f9f0654c819f3f5a806145847c9b899ae16859d870c7a3b320d43226",
              "expected_original_cells": 18,
              "terminal_valid_original_cells": 18,
              "all_contracts_match": True,
              "all_checkpoint_lineages_valid": True,
              "all_provider_identities_valid": True,
              "all_holdout_and_challenge_reports_complete": True,
              "replication_paid_execution_authorized": True,
          }
          mismatches = {key: (gate.get(key), value) for key, value in expected.items() if gate.get(key) != value}
          if mismatches:
              raise SystemExit(f"replication is blocked: invalid v1 core gate receipt: {mismatches}")
          PY

      - name: Run one supervised replication cell
        if: inputs.mode == 'execute'
        run: |
          resume=()
          if [ -n "${{ inputs.resume_run_id }}" ]; then
            resume=(--resume)
          fi
          timeout --signal=TERM --kill-after=60s 330m \
            python scripts/launch_scaling_paradox_v1.py \
              --config "$REPLICATION_CONFIG" \
              --stage core \
              --plan-dir "$REPLICATION_PLAN_DIR" \
              --execute \
              --wait \
              --run-key "${{ inputs.run_key }}" \
              --confirm-contract-sha "${{ inputs.launch_plan_sha }}" \
              "${resume[@]}"

      - name: Validate terminal replication report
        if: success() && inputs.mode == 'execute'
        env:
          EXPECTED_RUN_KEY: ${{ inputs.run_key }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          run_dir = Path("reports/scaling_paradox_v1_replication/runs") / os.environ["EXPECTED_RUN_KEY"]
          report = json.load(open(run_dir / "report.json"))
          contract = json.load(open(run_dir / "run_contract.json"))
          if report.get("contract_sha") != contract.get("run_contract_sha"):
              raise SystemExit("terminal replication report/contract mismatch")
          if len(report.get("batches", [])) != int(contract["max_steps"]):
              raise SystemExit("terminal replication report has an incomplete optimizer trajectory")
          if not report.get("checkpoint_path"):
              raise SystemExit("terminal replication report is missing its final checkpoint")
          PY

      - name: Preserve replication reports and resumable checkpoint lineage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaling-paradox-v1-replication-${{ inputs.run_key }}
          path: reports/scaling_paradox_v1_replication/runs/${{ inputs.run_key }}/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
