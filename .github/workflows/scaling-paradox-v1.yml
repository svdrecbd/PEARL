name: Scaling paradox v1 — one immutable run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the remote contract without spending, or execute one paid cell
        required: true
        default: validate
        type: choice
        options:
          - validate
          - execute
      stage:
        description: Frozen launch-plan stage
        required: true
        type: choice
        options:
          - smoke
          - core
          - data_exposure
          - adapter_rescue
      run_key:
        description: Exact immutable run key from the dry launch plan
        required: true
        type: string
      launch_plan_sha:
        description: Exact launch-plan contract SHA
        required: true
        type: string
      resume_run_id:
        description: Prior Actions run ID whose checkpoint artifact should be resumed
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: scaling-paradox-v1-${{ inputs.run_key }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
      WANDB_MODE: disabled
      PYTHONUNBUFFERED: "1"
      DATA_RELEASE_TAG: scaling-paradox-v1-data-v1
      DATA_ARCHIVE: pearl-scaling-paradox-v1-data.tar.gz
      DATA_ARCHIVE_SHA256: 6fb98995f35b871decc0ef31fcf6b794142d21bcd35ee3cd86c2f8df304c85c3
    steps:
      - name: Check out the exact submitted branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the pinned PEARL runtime
        run: python -m pip install --requirement requirements.txt

      - name: Restore the frozen PEARL dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$DATA_RELEASE_TAG" --pattern "$DATA_ARCHIVE"
          printf '%s  %s\n' "$DATA_ARCHIVE_SHA256" "$DATA_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$DATA_ARCHIVE"
          python - <<'PY'
          import json
          manifest = json.load(open("data/phase8_dpo/scaling_paradox_v1/dataset_manifest.json"))
          expected = "1f410d4346b354b789408729c2c7cfc1f0bdef3b9580716171d86593bd9e9a22"
          if manifest.get("manifest_sha256") != expected:
              raise SystemExit("dataset manifest contract SHA mismatch")
          PY

      - name: Restore a previous checkpoint artifact
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.resume_run_id }}" --name "scaling-paradox-${{ inputs.run_key }}" --dir .

      - name: Verify immutable plan identity
        run: |
          python scripts/launch_scaling_paradox_v1.py --stage "${{ inputs.stage }}" > launch-plan.json
          python - <<'PY'
          import json
          plan = json.load(open("reports/scaling_paradox_v1/${{ inputs.stage }}_launch_plan.json"))
          if plan["launch_plan_contract_sha"] != "${{ inputs.launch_plan_sha }}":
              raise SystemExit("launch-plan SHA mismatch")
          matches = [row for row in plan["runs"] if row["run_key"] == "${{ inputs.run_key }}"]
          if len(matches) != 1:
              raise SystemExit("run key is absent or non-unique")
          PY

      - name: Write a no-spend remote validation receipt
        if: inputs.mode == 'validate'
        run: |
          mkdir -p "reports/scaling_paradox_v1/runs/${{ inputs.run_key }}"
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = {
              "mode": "validate",
              "stage": "${{ inputs.stage }}",
              "run_key": "${{ inputs.run_key }}",
              "launch_plan_sha": "${{ inputs.launch_plan_sha }}",
              "dataset_archive_sha256": "6fb98995f35b871decc0ef31fcf6b794142d21bcd35ee3cd86c2f8df304c85c3",
              "dataset_manifest_sha256": "1f410d4346b354b789408729c2c7cfc1f0bdef3b9580716171d86593bd9e9a22",
              "paid_execution": False,
          }
          path = Path("reports/scaling_paradox_v1/runs/${{ inputs.run_key }}/remote_validation_receipt.json")
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Run one supervised Tinker cell
        if: inputs.mode == 'execute'
        run: |
          resume=()
          if [ -n "${{ inputs.resume_run_id }}" ]; then
            resume=(--resume)
          fi
          timeout --signal=TERM --kill-after=60s 330m \
            python scripts/launch_scaling_paradox_v1.py \
              --stage "${{ inputs.stage }}" \
              --execute \
              --wait \
              --run-key "${{ inputs.run_key }}" \
              --confirm-contract-sha "${{ inputs.launch_plan_sha }}" \
              "${resume[@]}"

      - name: Validate terminal report
        if: success() && inputs.mode == 'execute'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          run_dir = Path("reports/scaling_paradox_v1/runs/${{ inputs.run_key }}")
          report = json.load(open(run_dir / "report.json"))
          contract = json.load(open(run_dir / "run_contract.json"))
          if report.get("contract_sha") != contract.get("run_contract_sha"):
              raise SystemExit("terminal report/contract mismatch")
          if len(report.get("batches", [])) != int(contract["max_steps"]):
              raise SystemExit("terminal report has an incomplete optimizer trajectory")
          if not report.get("checkpoint_path"):
              raise SystemExit("terminal report is missing its final checkpoint")
          PY

      - name: Preserve reports and resumable checkpoint lineage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaling-paradox-${{ inputs.run_key }}
          path: reports/scaling_paradox_v1/runs/${{ inputs.run_key }}/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
