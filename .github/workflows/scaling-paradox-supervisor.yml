name: Scaling paradox campaign — validate and dispatch one exact wave
run-name: Scaling supervisor ${{ github.run_id }} ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reconstruct and report state, or advance by one machine-authorized wave
        required: true
        default: status
        type: choice
        options:
          - status
          - advance

permissions:
  contents: read
  actions: write

concurrency:
  group: scaling-paradox-campaign-supervisor
  cancel-in-progress: false

jobs:
  reconcile-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_RELEASE_TAG: scaling-paradox-v1-data-v2
      DATA_ARCHIVE: pearl-scaling-paradox-v1-data-v2.tar.gz
      DATA_ARCHIVE_SHA256: ffad79ec8e104bf06979882e186290ea4d94b87531e48b111e954b6c09e8e962
      STATE_DIR: supervisor/state
    steps:
      - name: Check out the exact supervisor commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the pinned PEARL runtime
        run: python -m pip install --requirement requirements.txt

      - name: Restore and verify the frozen dataset
        run: |
          gh release download "$DATA_RELEASE_TAG" --pattern "$DATA_ARCHIVE"
          printf '%s  %s\n' "$DATA_ARCHIVE_SHA256" "$DATA_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$DATA_ARCHIVE"

      - name: Reconstruct authoritative campaign state from Actions artifacts
        run: |
          python scripts/manage_scaling_paradox_campaign.py sync-github --state-dir "$STATE_DIR"
          python scripts/manage_scaling_paradox_campaign.py write-manifest \
            --output "$STATE_DIR/campaign_manifest.json"
          gate_run=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="scaling-paradox-core-analysis-gate" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$gate_run" ]; then
            gate_source=$(gh run view "$gate_run" --json workflowName,headSha,status,conclusion)
            test "$(jq -r .workflowName <<<"$gate_source")" = "Scaling paradox campaign — validate and dispatch one exact wave"
            test "$(jq -r .headSha <<<"$gate_source")" = "$GITHUB_SHA"
            test "$(jq -r .status <<<"$gate_source")" = completed
            test "$(jq -r .conclusion <<<"$gate_source")" = success
            mkdir -p "$STATE_DIR/analysis"
            gh run download "$gate_run" --name scaling-paradox-core-analysis-gate \
              --dir "$STATE_DIR/analysis"
          fi

      - name: Compute the only permitted next transition
        run: |
          active=$(python - <<'PY'
          import json
          import subprocess

          count = 0
          for workflow in (
              "scaling-paradox-v1.yml",
              "scaling-paradox-v1-replication.yml",
              "scaling-paradox-checkpoint-evaluation.yml",
          ):
              result = subprocess.run(
                  ["gh", "run", "list", "--workflow", workflow, "--limit", "100", "--json", "status"],
                  check=False, capture_output=True, text=True,
              )
              if result.returncode != 0:
                  if workflow == "scaling-paradox-checkpoint-evaluation.yml" and "not found" in result.stderr.lower():
                      continue
                  raise SystemExit(f"could not query active state for {workflow}")
              count += sum(
                  row["status"] in {"queued", "in_progress", "waiting", "pending"}
                  for row in json.loads(result.stdout)
              )
          print(count)
          PY
          )
          python scripts/manage_scaling_paradox_campaign.py next \
            --state-dir "$STATE_DIR" --active-paid-cells "$active" \
            --output supervisor/authorization.json
          action=$(jq -r .action supervisor/authorization.json)
          printf 'CAMPAIGN_ACTION=%s\n' "$action" >> "$GITHUB_ENV"
          if [[ "$action" == dispatch_* && "${{ inputs.mode }}" == advance ]]; then
            printf 'DISPATCH_ALLOWED=true\n' >> "$GITHUB_ENV"
          else
            printf 'DISPATCH_ALLOWED=false\n' >> "$GITHUB_ENV"
          fi

      - name: Run frozen complete-core analysis and evidence-bound rescue gate
        if: env.CAMPAIGN_ACTION == 'analyze_core' && inputs.mode == 'advance'
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          state = Path("supervisor/state")
          root = Path("supervisor/core_evaluations")
          for receipt_path in sorted((state / "receipts" / "evaluation").glob("*.json")):
              receipt = json.load(open(receipt_path))
              run_key = receipt["run_key"]
              if not (run_key.startswith("core-") or run_key.startswith("core-")):
                  continue
              subprocess.run([
                  "gh", "run", "download", str(receipt["source_actions_run_id"]),
                  "--name", f"scaling-paradox-evaluation-{run_key}",
                  "--dir", str(root / run_key),
              ], check=True)
          PY
          python scripts/analyze_scaling_paradox_optimization.py \
            --evaluations-root supervisor/core_evaluations \
            --output supervisor/state/analysis/core_optimization.json \
            --gate-output supervisor/state/analysis/adapter_rescue_gate.json

      - name: Preserve evidence-bound core analysis gate
        if: env.CAMPAIGN_ACTION == 'analyze_core' && inputs.mode == 'advance'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaling-paradox-core-analysis-gate
          path: |
            supervisor/state/analysis/core_optimization.json
            supervisor/state/analysis/adapter_rescue_gate.json
          if-no-files-found: error
          retention-days: 90

      - name: Refuse reuse of a prior authorization
        if: env.DISPATCH_ALLOWED == 'true'
        run: |
          auth_sha=$(jq -r .authorization_sha256 supervisor/authorization.json)
          printf 'AUTHORIZATION_SHA=%s\n' "$auth_sha" >> "$GITHUB_ENV"
          count=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="scaling-paradox-authorization-${auth_sha}" --jq '.total_count')
          test "$count" = 0 || { echo "authorization was already consumed"; exit 1; }

      - name: Publish one-time supervisor authorization
        if: env.DISPATCH_ALLOWED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaling-paradox-authorization-${{ env.AUTHORIZATION_SHA }}
          path: supervisor/authorization.json
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch and identify every authorized child
        if: env.DISPATCH_ALLOWED == 'true'
        env:
          SUPERVISOR_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from datetime import UTC, datetime
          from pathlib import Path

          authorization = json.load(open("supervisor/authorization.json"))
          action = authorization["action"]
          records = []
          receipt_path = Path("supervisor/dispatch_receipt.json")
          for run_key in authorization["authorized_run_keys"]:
              if action == "dispatch_training_wave":
                  workflow = authorization["workflow"]
                  title = f"Scaling train {authorization['campaign']} {run_key} supervisor-{os.environ['SUPERVISOR_RUN_ID']}"
                  command = [
                      "gh", "workflow", "run", workflow, "--ref", "main",
                      "-f", "mode=execute", "-f", f"stage={authorization['stage']}",
                      "-f", f"run_key={run_key}",
                      "-f", f"launch_plan_sha={authorization['plan_sha']}",
                      "-f", f"supervisor_run_id={os.environ['SUPERVISOR_RUN_ID']}",
                  ]
              else:
                  workflow = "scaling-paradox-checkpoint-evaluation.yml"
                  title = f"Scaling eval {authorization['campaign']} {run_key} supervisor-{os.environ['SUPERVISOR_RUN_ID']}"
                  source_id = authorization["source_actions_run_ids"][run_key]
                  command = [
                      "gh", "workflow", "run", workflow, "--ref", "main",
                      "-f", f"campaign={authorization['campaign']}",
                      "-f", f"stage={authorization['stage']}", "-f", f"run_key={run_key}",
                      "-f", f"launch_plan_sha={authorization['plan_sha']}",
                      "-f", f"source_run_id={source_id}",
                      "-f", f"source_artifact_name={authorization['source_artifact_prefix']}{run_key}",
                      "-f", f"supervisor_run_id={os.environ['SUPERVISOR_RUN_ID']}",
                  ]
              subprocess.run(command, check=True)
              child_id = None
              for _ in range(30):
                  rows = json.loads(subprocess.run(
                      ["gh", "run", "list", "--workflow", workflow, "--limit", "100", "--json", "databaseId,displayTitle"],
                      check=True, capture_output=True, text=True,
                  ).stdout)
                  matches = [int(row["databaseId"]) for row in rows if row["displayTitle"] == title]
                  if len(matches) == 1:
                      child_id = matches[0]
                      break
                  if len(matches) > 1:
                      raise SystemExit(f"non-unique child run title: {title}")
                  time.sleep(2)
              if child_id is None:
                  raise SystemExit(f"dispatched child did not become observable: {title}")
              records.append({
                  "run_key": run_key, "action": action, "child_actions_run_id": child_id,
                  "dispatched_at_utc": datetime.now(UTC).isoformat(),
                  "supervisor_run_id": int(os.environ["SUPERVISOR_RUN_ID"]),
              })
              receipt_path.write_text(json.dumps({"dispatches": records}, indent=2, sort_keys=True) + "\n")
          PY

      - name: Preserve dispatch receipt
        if: always() && env.DISPATCH_ALLOWED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaling-paradox-dispatch-${{ github.run_id }}
          path: supervisor/dispatch_receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve sanitized reconciled state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scaling-paradox-supervisor-state-${{ github.run_id }}
          path: |
            supervisor/authorization.json
            supervisor/state/receipts/
            supervisor/state/submissions/
            supervisor/state/campaign_manifest.json
          if-no-files-found: warn
          retention-days: 90
