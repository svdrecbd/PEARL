name: Frontier adaptation v2 — one immutable structural generation cell
run-name: Frontier structural generation ${{ inputs.job_key }} supervisor-${{ inputs.supervisor_run_id }}

on:
  workflow_dispatch:
    inputs:
      job_key:
        required: true
        type: string
      structural_manifest_sha:
        required: true
        type: string
      supervisor_run_id:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: frontier-adaptation-v2-structural-generation-${{ inputs.job_key }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_JOB_KEY: ${{ inputs.job_key }}
      INPUT_MANIFEST_SHA: ${{ inputs.structural_manifest_sha }}
      INPUT_SUPERVISOR_RUN_ID: ${{ inputs.supervisor_run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --requirement requirements.txt

      - name: Download and verify supervisor manifest
        run: |
          [[ "$INPUT_JOB_KEY" =~ ^[a-z0-9][a-z0-9._-]{0,199}$ ]] || { echo "invalid job key"; exit 1; }
          [[ "$INPUT_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid manifest SHA"; exit 1; }
          [[ "$INPUT_SUPERVISOR_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid supervisor ID"; exit 1; }
          printf 'SAFE_JOB_KEY=%s\n' "$INPUT_JOB_KEY" >> "$GITHUB_ENV"
          existing=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="frontier-adaptation-v2-structural-generation-$INPUT_JOB_KEY" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          test "$existing" = 0 || { echo "structural generation artifact already exists"; exit 1; }
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$INPUT_SUPERVISOR_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("frontier-adaptation-v2-structural-manifest-")) | .name] | if length == 1 then .[0] else error("manifest artifact absent or non-unique") end')
          mkdir -p supervisor source
          gh run download "$INPUT_SUPERVISOR_RUN_ID" --name "$artifact" --dir supervisor
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          manifest = json.load(open("supervisor/structural_manifest.json"))
          action = json.load(open("supervisor/structural_action.json"))
          if manifest["structural_manifest_sha"] != os.environ["INPUT_MANIFEST_SHA"]:
              raise SystemExit("structural manifest SHA mismatch")
          jobs = [row for row in manifest["jobs"] if row["job_key"] == os.environ["INPUT_JOB_KEY"]]
          if len(jobs) != 1:
              raise SystemExit("structural job is absent or non-unique")
          if action.get("action") != "dispatch" or os.environ["INPUT_JOB_KEY"] not in action.get("job_keys", []):
              raise SystemExit("structural job is outside the supervisor-authorized wave")
          job = jobs[0]
          unsigned = {key: value for key, value in job.items() if key not in {"structural_job_sha", "job_key"}}
          digest = hashlib.sha256(json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          if digest != job["structural_job_sha"]:
              raise SystemExit("structural job SHA mismatch")
          supervisor = json.loads(subprocess.run(
              ["gh", "run", "view", os.environ["INPUT_SUPERVISOR_RUN_ID"], "--json", "workflowName,headSha,status,conclusion"],
              check=True, capture_output=True, text=True,
          ).stdout)
          if supervisor["workflowName"] != "Frontier adaptation v2 structural — reconcile and dispatch one wave":
              raise SystemExit("structural manifest has the wrong supervisor")
          if supervisor["headSha"] != os.environ["GITHUB_SHA"] or supervisor["status"] not in {"in_progress", "completed"}:
              raise SystemExit("structural worker and supervisor commits/states differ")
          Path("job.json").write_text(json.dumps(job, indent=2, sort_keys=True) + "\n")
          PY

      - name: Restore and validate source training artifact
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          job = json.load(open("job.json"))
          source = job.get("source_training")
          if source is None:
              raise SystemExit(0)
          subprocess.run([
              "gh", "run", "download", str(source["actions_run_id"]),
              "--name", source["artifact_name"], "--dir", "source",
          ], check=True)
          expected = {
              "run_contract.json": source["run_contract_file_sha256"],
              "report.json": source["training_report_file_sha256"],
              "checkpoint_lineage.json": source["checkpoint_lineage_file_sha256"],
          }
          paths = {}
          for name, digest in expected.items():
              found = list(Path("source").rglob(name))
              if len(found) != 1 or hashlib.sha256(found[0].read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"structural source {name} is absent/non-unique/hash-mismatched")
              paths[name] = str(found[0])
          Path("source_paths.json").write_text(json.dumps(paths))
          PY

      - name: Generate all 96 frozen candidate slots
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          python - <<'PY'
          import json, subprocess, sys

          job = json.load(open("job.json"))
          command = [
              sys.executable, "scripts/run_scaling_paradox_generation.py",
              "--config", job["structural_config"], "--model", job["model"],
              "--arm", job["arm"], "--training-seed", str(job["training_seed"]),
              "--checkpoint-step", str(job["checkpoint_step"]),
              "--output-dir", "structural_output",
          ]
          if job["checkpoint_path"]:
              paths = json.load(open("source_paths.json"))
              command.extend([
                  "--checkpoint-path", job["checkpoint_path"],
                  "--source-run-contract", paths["run_contract.json"],
                  "--source-training-report", paths["report.json"],
                  "--source-checkpoint-lineage", paths["checkpoint_lineage.json"],
              ])
          subprocess.run(command, check=True)
          PY

      - name: Validate complete generation artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path("structural_output").rglob("generation_report.json"))
          if len(reports) != 1:
              raise SystemExit("generation report is absent or non-unique")
          report = json.load(open(reports[0]))
          if report.get("status") != "complete" or not report.get("complete"):
              raise SystemExit("generation report is incomplete")
          if report.get("expected_candidate_count") != 96 or report.get("completed_candidate_count") != 96:
              raise SystemExit("generation report does not preserve all 96 candidate slots")
          PY

      - name: Preserve generation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontier-adaptation-v2-structural-generation-${{ env.SAFE_JOB_KEY }}
          path: structural_output/
          if-no-files-found: error
          retention-days: 90
