name: Frontier adaptation v2 — validate and dispatch one exact wave
run-name: Frontier supervisor ${{ github.run_id }} ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto-advance' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reconstruct and report state, or advance by one machine-authorized wave
        required: true
        default: status
        type: choice
        options:
          - status
          - advance
  workflow_run:
    workflows:
      - Frontier adaptation v2 — one immutable run
      - Frontier adaptation v2 — one immutable checkpoint evaluation
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: frontier-adaptation-v2-campaign-supervisor
  cancel-in-progress: false

jobs:
  reconcile-and-dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       !endsWith(github.event.workflow_run.display_title, 'supervisor-validate'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_RELEASE_TAG: scaling-paradox-v1-data-v2
      DATA_ARCHIVE: pearl-scaling-paradox-v1-data-v2.tar.gz
      DATA_ARCHIVE_SHA256: ffad79ec8e104bf06979882e186290ea4d94b87531e48b111e954b6c09e8e962
      STATE_DIR: supervisor/state
      SUPERVISOR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'advance' }}
    steps:
      - name: Verify an automatic trigger against its immutable supervisor tag
        if: github.event_name == 'workflow_run'
        env:
          TRIGGER_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$TRIGGER_DISPLAY_TITLE" =~ supervisor-([1-9][0-9]*)$ ]] || { echo "automatic trigger lacks a numeric supervisor owner"; exit 1; }
          dispatch_ref="frontier-supervisor-${BASH_REMATCH[1]}"
          observed=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${dispatch_ref}" --jq .object.sha)
          test "$observed" = "$TRIGGER_HEAD_SHA" || { echo "automatic trigger differs from its immutable supervisor tag"; exit 1; }

      - name: Check out the exact supervisor commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the pinned PEARL runtime
        run: python -m pip install --requirement requirements.txt

      - name: Restore and verify the frozen dataset
        run: |
          gh release download "$DATA_RELEASE_TAG" --pattern "$DATA_ARCHIVE"
          printf '%s  %s\n' "$DATA_ARCHIVE_SHA256" "$DATA_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$DATA_ARCHIVE"

      - name: Reconstruct authoritative campaign state from Actions artifacts
        run: |
          python scripts/manage_scaling_paradox_campaign.py --executor-config configs/experiments/frontier_adaptation_v2_executor.json sync-github --state-dir "$STATE_DIR"
          python scripts/manage_scaling_paradox_campaign.py --executor-config configs/experiments/frontier_adaptation_v2_executor.json write-manifest \
            --output "$STATE_DIR/campaign_manifest.json"

      - name: Capture sanitized provider operational state
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          python scripts/manage_scaling_paradox_campaign.py --executor-config configs/experiments/frontier_adaptation_v2_executor.json provider-snapshot \
            --output "$STATE_DIR/provider_snapshot.json"

      - name: Compute the only permitted next transition
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: |
          python scripts/manage_scaling_paradox_campaign.py \
            --executor-config configs/experiments/frontier_adaptation_v2_executor.json \
            converge-active-inventory --state-dir "$STATE_DIR" \
            --output "$STATE_DIR/active_runs.json" \
            --provider-output "$STATE_DIR/provider_snapshot.json"
          active=$(jq 'length' "$STATE_DIR/active_runs.json")
          python scripts/manage_scaling_paradox_campaign.py --executor-config configs/experiments/frontier_adaptation_v2_executor.json next \
            --state-dir "$STATE_DIR" --active-paid-cells "$active" \
            --active-runs-json "$STATE_DIR/active_runs.json" \
            --provider-snapshot "$STATE_DIR/provider_snapshot.json" \
            --output supervisor/authorization.json
          action=$(jq -r .action supervisor/authorization.json)
          printf 'CAMPAIGN_ACTION=%s\n' "$action" >> "$GITHUB_ENV"
          if [[ "$action" == dispatch_* && "$SUPERVISOR_MODE" == advance ]]; then
            printf 'DISPATCH_ALLOWED=true\n' >> "$GITHUB_ENV"
          else
            printf 'DISPATCH_ALLOWED=false\n' >> "$GITHUB_ENV"
          fi

      - name: Refuse reuse of a prior authorization
        if: env.DISPATCH_ALLOWED == 'true'
        run: |
          auth_sha=$(jq -r .authorization_sha256 supervisor/authorization.json)
          printf 'AUTHORIZATION_SHA=%s\n' "$auth_sha" >> "$GITHUB_ENV"
          count=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="frontier-adaptation-v2-authorization-${auth_sha}" --jq '.total_count')
          test "$count" = 0 || { echo "authorization was already consumed"; exit 1; }

      - name: Create and verify the immutable supervisor dispatch tag
        if: env.DISPATCH_ALLOWED == 'true'
        run: |
          dispatch_ref="frontier-supervisor-${GITHUB_RUN_ID}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          resolve_dispatch_ref() {
            # shellcheck disable=SC2016 # GraphQL variables are intentionally literal.
            gh api graphql \
              -f owner="$GITHUB_REPOSITORY_OWNER" \
              -f name="$repository_name" \
              -f qualifiedName="refs/tags/${dispatch_ref}" \
              -f query='query($owner: String!, $name: String!, $qualifiedName: String!) {
                repository(owner: $owner, name: $name) {
                  ref(qualifiedName: $qualifiedName) { target { oid } }
                }
              }' \
              --jq '.data.repository.ref.target.oid // ""'
          }
          existing=$(resolve_dispatch_ref)
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${dispatch_ref}" -f sha="$GITHUB_SHA" >/dev/null
          else
            test "$existing" = "$GITHUB_SHA" || { echo "supervisor dispatch tag points to another commit"; exit 1; }
          fi
          observed=$(resolve_dispatch_ref)
          test "$observed" = "$GITHUB_SHA" || { echo "supervisor dispatch tag verification failed"; exit 1; }
          printf 'DISPATCH_REF=%s\n' "$dispatch_ref" >> "$GITHUB_ENV"

      - name: Publish one-time supervisor authorization
        if: env.DISPATCH_ALLOWED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontier-adaptation-v2-authorization-${{ env.AUTHORIZATION_SHA }}
          path: supervisor/authorization.json
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch and identify every authorized child
        if: env.DISPATCH_ALLOWED == 'true'
        env:
          SUPERVISOR_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from datetime import UTC, datetime
          from pathlib import Path

          authorization = json.load(open("supervisor/authorization.json"))
          action = authorization["action"]
          records = []
          receipt_path = Path("supervisor/dispatch_receipt.json")
          receipt_path.write_text(json.dumps({"dispatches": records}, indent=2, sort_keys=True) + "\n")
          for run_key in authorization["authorized_run_keys"]:
              if action in {"dispatch_training_wave", "dispatch_training_resume"}:
                  workflow = authorization["workflow"]
                  title = f"Frontier train {authorization['campaign']} {run_key} supervisor-{os.environ['SUPERVISOR_RUN_ID']}"
                  command = [
                      "gh", "workflow", "run", workflow, "--ref", os.environ["DISPATCH_REF"],
                      "-f", f"campaign={authorization['campaign']}",
                      "-f", "mode=execute", "-f", f"stage={authorization['stage']}",
                      "-f", f"run_key={run_key}",
                      "-f", f"launch_plan_sha={authorization['plan_sha']}",
                      "-f", f"supervisor_run_id={os.environ['SUPERVISOR_RUN_ID']}",
                      "-f", f"authorization_action={action}",
                      "-f", f"segment_end_step={authorization['segment_end_steps'][run_key]}",
                  ]
                  if action == "dispatch_training_resume":
                      command.extend([
                          "-f", f"resume_run_id={authorization['source_actions_run_ids'][run_key]}",
                      ])
              else:
                  workflow = authorization["workflow"]
                  title = f"Frontier eval {authorization['campaign']} {run_key} supervisor-{os.environ['SUPERVISOR_RUN_ID']}"
                  source_id = authorization["source_actions_run_ids"][run_key]
                  command = [
                      "gh", "workflow", "run", workflow, "--ref", os.environ["DISPATCH_REF"],
                      "-f", f"campaign={authorization['campaign']}",
                      "-f", f"stage={authorization['stage']}", "-f", f"run_key={run_key}",
                      "-f", f"launch_plan_sha={authorization['plan_sha']}",
                      "-f", f"source_run_id={source_id}",
                      "-f", f"source_artifact_name={authorization['source_artifact_prefix']}{run_key}",
                      "-f", f"supervisor_run_id={os.environ['SUPERVISOR_RUN_ID']}",
                  ]
              subprocess.run(command, check=True)
              child_id = None
              for _ in range(30):
                  rows = json.loads(subprocess.run(
                      ["gh", "run", "list", "--workflow", workflow, "--limit", "100", "--json", "databaseId,displayTitle"],
                      check=True, capture_output=True, text=True,
                  ).stdout)
                  matches = [int(row["databaseId"]) for row in rows if row["displayTitle"] == title]
                  if len(matches) == 1:
                      child_id = matches[0]
                      break
                  if len(matches) > 1:
                      raise SystemExit(f"non-unique child run title: {title}")
                  time.sleep(2)
              if child_id is None:
                  raise SystemExit(f"dispatched child did not become observable: {title}")
              records.append({
                  "run_key": run_key, "action": action, "child_actions_run_id": child_id,
                  "dispatched_at_utc": datetime.now(UTC).isoformat(),
                  "supervisor_run_id": int(os.environ["SUPERVISOR_RUN_ID"]),
              })
              receipt_path.write_text(json.dumps({"dispatches": records}, indent=2, sort_keys=True) + "\n")
          PY

      - name: Preserve dispatch receipt
        if: always() && env.DISPATCH_ALLOWED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontier-adaptation-v2-dispatch-${{ github.run_id }}
          path: supervisor/dispatch_receipt.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve sanitized reconciled state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontier-adaptation-v2-supervisor-state-${{ github.run_id }}
          path: |
            supervisor/authorization.json
            supervisor/state/receipts/
            supervisor/state/submissions/
            supervisor/state/actions_runs/
            supervisor/state/continuations/
            supervisor/state/quarantines/
            supervisor/state/campaign_manifest.json
            supervisor/state/active_runs.json
            supervisor/state/provider_snapshot.json
          if-no-files-found: warn
          retention-days: 90
